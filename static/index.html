<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VanillaEditor</title>
<style>
:root{--bg:#1e1e1e;--bg2:#252526;--bg3:#2d2d2d;--hover:#3a3d41;--active:#37373d;--text:#ccc;--text2:#858585;--accent:#0e639c;--border:#3e3e42;--status:#007acc;--ok:#89d185;--err:#f14c4c}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',sans-serif;background:var(--bg);color:var(--text);font-size:13px;height:100vh;overflow:hidden}
input,button,select,textarea{font-family:inherit;font-size:inherit}
input[type=text],input[type=password],textarea,select{background:var(--bg);border:1px solid var(--border);color:var(--text);padding:6px 10px;border-radius:4px;width:100%}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent)}
button{cursor:pointer;border:1px solid transparent;border-radius:4px;padding:5px 14px;font-size:13px}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-primary:hover{background:#1177bb}
.btn-secondary{background:var(--bg3);color:var(--text);border-color:var(--border)}
.btn-secondary:hover{background:var(--hover)}
.btn-link{background:none;border:none;color:#858585;text-decoration:underline}
.btn-sm{padding:2px 8px;font-size:12px}
.w-100{width:100%}
.mb-2{margin-bottom:8px}
.mb-3{margin-bottom:12px}
.text-danger{color:var(--err)}
.text-muted{color:var(--text2)}
.hidden{display:none!important}
#app{height:100vh;display:flex;flex-direction:column}
.menu{display:flex;align-items:center;height:30px;background:var(--bg2);border-bottom:1px solid var(--border);padding:0 8px;user-select:none;font-size:13px}
.menu .logo{color:#4ec9b0;font-weight:bold;margin-right:16px}
.menu .mi{padding:2px 8px;border-radius:3px;cursor:pointer}
.menu .mi:hover{background:var(--hover)}
.menu .tabs{margin-left:auto;display:flex;gap:2px}
.menu .tab{padding:2px 10px;background:var(--bg);border-radius:3px 3px 0 0;font-size:12px;display:flex;align-items:center;gap:6px}
.menu .tab .unsaved{color:#e2c08d}
.main{display:flex;flex:1;overflow:hidden}
.abar{width:48px;background:#333;display:flex;flex-direction:column;align-items:center;padding-top:8px;gap:4px}
.abar .ib{width:48px;height:48px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text2);font-size:20px;border-left:2px solid transparent}
.abar .ib:hover{color:var(--text)}
.abar .ib.on{color:var(--text);border-left-color:var(--text)}
.sidebar{width:220px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.sidebar .sh{padding:8px 12px;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--text2);display:flex;justify-content:space-between;align-items:center}
.sidebar .sc{flex:1;overflow-y:auto;padding:4px 0}
.ti{display:flex;align-items:center;padding:3px 12px;cursor:pointer;gap:4px;font-size:13px}
.ti:hover{background:var(--hover)}
.ti.on{background:var(--active)}
.ti .arr{font-size:10px;width:12px;color:var(--text2)}
.ti .ic{font-size:14px}
.ti .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.eara{flex:1;display:flex;flex-direction:column;overflow:hidden}
.etabs{display:flex;background:var(--bg2);border-bottom:1px solid var(--border);min-height:35px}
.etab{padding:6px 12px;cursor:pointer;display:flex;align-items:center;gap:6px;font-size:12px;border-right:1px solid var(--border)}
.etab.on{background:var(--bg);border-bottom:1px solid var(--bg);margin-bottom:-1px}
.ediv{flex:1;display:flex;overflow:hidden}
.ed{flex:1;width:100%;background:var(--bg);color:#d4d4d4;border:none;resize:none;outline:none;padding:12px 16px;font-family:'JetBrains Mono','Fira Code',Consolas,monospace;font-size:14px;line-height:1.6;tab-size:2}
.ppane{flex:1;overflow:auto;padding:16px;background:var(--bg)}
.ppane h1,.ppane h2,.ppane h3{color:var(--text);border-bottom:1px solid var(--border);padding-bottom:4px;margin-bottom:8px}
.ppane h4,.ppane h5,.ppane h6{color:var(--text);margin-bottom:6px}
.ppane code{background:var(--bg3);padding:2px 5px;border-radius:3px;font-size:12px;font-family:Consolas,monospace}
.ppane pre{background:var(--bg3);padding:12px;border-radius:6px;overflow-x:auto;margin:8px 0}
.ppane pre code{background:none;padding:0}
.ppane blockquote{border-left:3px solid var(--accent);padding-left:12px;color:var(--text2);margin:8px 0}
.ppane table{border-collapse:collapse;width:100%;margin:8px 0}
.ppane th,.ppane td{border:1px solid var(--border);padding:6px 10px;text-align:left}
.ppane th{background:var(--bg3)}
.ppane ul,.ppane ol{padding-left:20px;margin:4px 0}
.ppane li{margin:2px 0}
.ppane a{color:var(--accent)}
.sbar{height:22px;background:var(--status);display:flex;align-items:center;padding:0 10px;font-size:11px;color:#fff;gap:16px}
.sbar .r{margin-left:auto}
.gp{padding:12px}
.gp .st{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--text2);margin:8px 0 6px}
.gp textarea{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:8px;border-radius:4px;resize:vertical;min-height:60px;font-family:inherit;font-size:12px}
.gp textarea:focus{outline:none;border-color:var(--accent)}
.gp .btns{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.gp .sync-row{display:flex;align-items:center;gap:8px;margin-top:8px}
.gp .ci2{display:flex;align-items:center;gap:8px;padding:4px 8px;border-radius:3px;cursor:pointer;font-size:12px}
.gp .ci2:hover{background:var(--hover)}
.gp .ci2 .dot{width:8px;height:8px;border-radius:50%;background:var(--text2);display:inline-block}
.gp .ci2 .msg{flex:1}
.gp .ci2 .tm{color:var(--text2);font-size:11px}
.pg{padding:20px}
.pg h4{color:var(--text);margin-bottom:16px}
.pg .card{background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:16px;margin-bottom:12px}
.pg .card-title{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--text2);margin-bottom:12px}
.pg label{font-size:12px;color:var(--text2)}
.lc{height:100vh;display:flex;align-items:center;justify-content:center}
.lb{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:40px;width:360px;text-align:center}
.lb h2{color:#4ec9b0;margin-bottom:24px}
.tt{position:fixed;bottom:30px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px}
.tt .ti2{background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:10px 16px;font-size:13px;display:flex;align-items:center;gap:8px;min-width:200px;animation:sIn .2s ease}
.tt .ti2.ok{border-left:3px solid var(--ok)}
.tt .ti2.err{border-left:3px solid var(--err)}
.tt .ti2.info{border-left:3px solid #3b86f6}
@keyframes sIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:#555}
</style>
</head>
<body>
<div id="app"></div>

<script>
// ── Simple router ────────────────────────────────────────────
const Router = {
  currentHash: '',
  routes: {},
  register(path, render) { this.routes[path] = render; },
  navigate(hash) { this.currentHash = hash; this.render(); },
  render() {
    const hash = location.hash || '#/login';
    const handler = this.routes[hash] || this.routes['#/login'];
    if (handler) handler();
  },
  go(to) { location.hash = to; }
};
window.addEventListener('hashchange', () => Router.render());

// ── Auth state ────────────────────────────────────────────────
const auth = {
  token: localStorage.getItem('ve_token') || '',
  username: localStorage.getItem('ve_username') || '',
  get isLoggedIn() { return !!this.token; },
  login(tok, user) { this.token = tok; this.username = user; localStorage.setItem('ve_token', tok); localStorage.setItem('ve_username', user); },
  logout() { this.token = ''; this.username = ''; localStorage.removeItem('ve_token'); localStorage.removeItem('ve_username'); }
};

// ── Editor state ─────────────────────────────────────────────
const editor = {
  activeDocId: '', activeFilePath: '', content: '', fileSha: '', gitBranch: 'main', unsaved: false
};

// ── API ───────────────────────────────────────────────────────
async function apiFetch(path, opts = {}) {
  const headers = { 'Content-Type': 'application/json', ...(opts.headers || {}) };
  if (auth.token) headers['Authorization'] = 'Bearer ' + auth.token;
  const res = await fetch('/api' + path, { ...opts, headers });
  if (res.status === 401) { auth.logout(); Router.go('#/login'); return null; }
  if (!res.ok) { const text = await res.text(); throw new Error(text || res.statusText); }
  return res.json();
}

// ── Toast ────────────────────────────────────────────────────
function toast(msg, type = 'info') {
  const id = Date.now();
  const el = document.createElement('div');
  el.className = 'tt';
  el.innerHTML = '<div class="ti2 ' + type + '">' + msg + '<i style="margin-left:auto;cursor:pointer" onclick="this.parentElement.parentElement.remove()">✕</i></div>';
  document.body.appendChild(el);
  setTimeout(() => { if (el.firstChild) el.firstChild.remove(); }, 3000);
}

// ── Markdown parser (simple inline) ────────────────────────
function parseMd(src) {
  if (!src) return '';
  return src
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/^### (.*$)/gim, '<h3>$1</h3>')
    .replace(/^## (.*$)/gim, '<h2>$1</h2>')
    .replace(/^# (.*$)/gim, '<h1>$1</h1>')
    .replace(/\*\*(.*)\*\*/gim, '<strong>$1</strong>')
    .replace(/\*(.*)\*/gim, '<em>$1</em>')
    .replace(/`([^`]+)`/gim, '<code>$1</code>')
    .replace(/^\> (.*$)/gim, '<blockquote>$1</blockquote>')
    .replace(/^\- (.*$)/gim, '<li>$1</li>')
    .replace(/^\d+\. (.*$)/gim, '<li>$1</li>')
    .replace(/\n/gim, '<br>');
}

// ── State variables ──────────────────────────────────────────
let activePanel = 'files';
let sidebarDocs = [];
let sidebarFiles = [];
let expandedDocs = {};
let commitMsg = '';
let selectedRemote = '';
let remotes = [];
let commits = [];
let previewContent = '';
let isRegister = false;
let loginError = '';
let saveTimer = null;
let timeDisplay = new Date().toLocaleTimeString();
const render = renderEditor;
setInterval(() => { timeDisplay = new Date().toLocaleTimeString(); render(); }, 1000);

// ── Login / Register ─────────────────────────────────────────
function renderLogin() {
  document.getElementById('app').innerHTML =
    '<div class="lc"><div class="lb">' +
      '<h2>🌿 VanillaEditor</h2>' +
      '<p style="font-size:12px;color:#858585;margin-bottom:24px">分布式离线 Markdown 编辑器</p>' +
      '<form onsubmit="handleAuth(event)">' +
        '<div class="mb-3"><input type="text" id="u" placeholder="用户名" required autofocus></div>' +
        '<div class="mb-3"><input type="password" id="p" placeholder="密码" required></div>' +
        (isRegister ? '<div class="mb-3"><input type="password" id="cp" placeholder="确认密码"></div>' : '') +
        (loginError ? '<div class="text-danger mb-3" style="font-size:12px">' + loginError + '</div>' : '') +
        '<button type="submit" class="btn-primary w-100 mb-2" id="loginBtn">' + (isRegister ? '注册' : '登录') + '</button>' +
        '<button type="button" class="btn-link w-100" onclick="toggleAuthMode()">' + (isRegister ? '已有账号？返回登录' : '还没有账号？点击注册') + '</button>' +
      '</form></div></div>';
}

function toggleAuthMode() {
  isRegister = !isRegister;
  loginError = '';
  document.getElementById('u').value = '';
  document.getElementById('p').value = '';
  const cp = document.getElementById('cp');
  if (cp) cp.value = '';
  renderLogin();
}

async function handleAuth(e) {
  e.preventDefault();
  const u = document.getElementById('u').value.trim();
  const p = document.getElementById('p').value;
  const cp = document.getElementById('cp');
  loginError = '';
  const btn = document.getElementById('loginBtn');
  btn.disabled = true; btn.textContent = '处理中...';
  try {
    if (isRegister) {
      if (cp && cp.value !== p) { loginError = '两次输入的密码不一致'; btn.disabled = false; btn.textContent = '注册'; return; }
      await apiFetch('/auth/init', { method: 'POST', body: JSON.stringify({ username: u, password: p }) });
    }
    const r = await apiFetch('/auth/login', { method: 'POST', body: JSON.stringify({ username: u, password: p }) });
    if (r) { auth.login(r.token, r.username); Router.go('#/editor'); }
  } catch(e) { loginError = e.message || '操作失败'; btn.disabled = false; btn.textContent = isRegister ? '注册' : '登录'; }
}

// ── File operations ──────────────────────────────────────────
async function loadFiles() {
  const data = await apiFetch('/docs');
  if (!data) return;
  sidebarDocs = data;
  sidebarFiles = data.flatMap(d => (d.children || []).map(f => ({ ...f, docId: d.id })));
  if (data.length > 0 && !editor.activeDocId) {
    const first = data[0];
    editor.activeDocId = first.id;
    editor.gitBranch = 'main';
    if (first.children && first.children.length > 0) await openFile(first.id, first.children[0].path);
  }
}

async function openFile(docId, filePath) {
  editor.activeDocId = docId;
  editor.activeFilePath = filePath;
  const r = await apiFetch('/files/' + docId + '/' + encodeURIComponent(filePath));
  if (r) {
    editor.content = r.content;
    editor.fileSha = r.sha;
    editor.unsaved = false;
    previewContent = r.content;
  }
  render();
}

function onEditorChange(val) {
  editor.content = val;
  editor.unsaved = true;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    if (!editor.activeDocId || !editor.activeFilePath) return;
    const r = await apiFetch('/files/' + editor.activeDocId + '/' + encodeURIComponent(editor.activeFilePath), {
      method: 'PUT', body: JSON.stringify({ content: val })
    });
    if (r) { editor.unsaved = false; toast('已保存', 'ok'); render(); }
  }, 1500);
}

async function loadGitData() {
  if (!editor.activeDocId) return;
  try { const r = await apiFetch('/sync/remote', { method: 'POST', body: JSON.stringify({ doc_id: editor.activeDocId }) }); if (r) remotes = r; } catch {}
  try { const r = await apiFetch('/history/' + editor.activeDocId); if (r) commits = r; } catch {}
}

async function pullGit() {
  if (!editor.activeDocId) return;
  const r = await apiFetch('/sync/pull', { method: 'POST', body: JSON.stringify({ doc_id: editor.activeDocId }) });
  if (r) { loadGitData(); toast('拉取成功', 'ok'); } else toast('拉取失败', 'err');
}

async function pushGit(remote) {
  if (!editor.activeDocId) return;
  const body = { doc_id: editor.activeDocId };
  if (remote) body.remote = remote;
  const r = await apiFetch('/sync/push', { method: 'POST', body: JSON.stringify(body) });
  if (r) { loadGitData(); toast('推送成功', 'ok'); } else toast('推送失败', 'err');
}

async function commitGit() {
  if (!editor.activeDocId || !commitMsg.trim()) return;
  const r = await apiFetch('/commit', { method: 'POST', body: JSON.stringify({ doc_id: editor.activeDocId, message: commitMsg }) });
  if (r) { commitMsg = ''; loadGitData(); toast('提交成功', 'ok'); } else toast('提交失败', 'err');
}

async function syncToRemote(remote) {
  if (!editor.activeDocId || !remote) return;
  await pushGit(remote);
  await pullGit();
  toast('同步完成', 'ok');
}

// ── Menu / panel actions ─────────────────────────────────────
function handleMenu(action) {
  if (action === 'git') activePanel = activePanel === 'git' ? 'files' : 'git';
  else if (action === 'files') activePanel = activePanel === 'files' ? '' : 'files';
  else if (action === 'logout') { auth.logout(); location.reload(); }
}

function toggleDoc(docId) {
  expandedDocs[docId] = !expandedDocs[docId];
  render();
}

// ── Render editor layout ─────────────────────────────────────
function renderEditor() {
  const app = document.getElementById('app');

  // Menu bar
  const menu = document.createElement('div');
  menu.className = 'menu';
  menu.innerHTML =
    '<span class="logo">🌿 VE</span>' +
    '<span class="mi" onclick="handleMenu(\'files\')">文件</span>' +
    '<span class="mi" onclick="handleMenu(\'git\')">Git</span>' +
    '<span class="mi" onclick="handleMenu(\'settings\')">设置</span>' +
    (editor.activeFilePath ? '<div class="tabs"><div class="tab"><span>' + editor.activeFilePath.split('/').pop() + '</span>' + (editor.unsaved ? '<span class="unsaved">●</span>' : '') + '</div></div>' : '') +
    '<span class="mi" style="margin-left:auto" onclick="handleMenu(\'logout\')">👤 ' + auth.username + '</span>';

  // Main area
  const main = document.createElement('div');
  main.className = 'main';

  if (activePanel === 'files') {
    // Activity bar
    const abar = document.createElement('div');
    abar.className = 'abar';
    ['files','git','search','settings'].forEach(id => {
      const ib = document.createElement('div');
      ib.className = 'ib' + (activePanel === id ? ' on' : '');
      const icons = { files: '📁', git: '🔀', search: '🔍', settings: '⚙️' };
      ib.textContent = icons[id] || '';
      ib.onclick = () => { activePanel = activePanel === id ? '' : id; render(); };
      abar.appendChild(ib);
    });
    main.appendChild(abar);

    // Sidebar
    const sidebar = document.createElement('div');
    sidebar.className = 'sidebar';
    const sh = document.createElement('div');
    sh.className = 'sh';
    sh.innerHTML = '<span>资源管理器</span><span style="cursor:pointer" onclick="createDoc()">＋</span>';
    sidebar.appendChild(sh);
    const sc = document.createElement('div');
    sc.className = 'sc';
    if (sidebarDocs.length === 0) {
      sc.innerHTML = '<div style="padding:12px;font-size:12px;color:#858585">暂无文档</div>';
    } else {
      sidebarDocs.forEach(doc => {
        const ti = document.createElement('div');
        ti.className = 'ti';
        ti.innerHTML =
          '<span class="arr">' + (expandedDocs[doc.id] ? '▼' : '▶') + '</span>' +
          '<span class="ic">📁</span>' +
          '<span class="nm">' + doc.name + '</span>' +
          '<span style="font-size:10px;color:#858585">' + (doc.file_count || 0) + '</span>';
        ti.onclick = () => toggleDoc(doc.id);
        sc.appendChild(ti);
        if (expandedDocs[doc.id] && doc.children) {
          doc.children.forEach(f => {
            const fi = document.createElement('div');
            fi.className = 'ti' + (editor.activeDocId === doc.id && editor.activeFilePath === f.path ? ' on' : '');
            fi.innerHTML =
              '<span class="arr"></span>' +
              '<span class="ic">' + (f.path.endsWith('.md') ? '📝' : '📄') + '</span>' +
              '<span class="nm">' + f.path.split('/').pop() + '</span>';
            fi.onclick = () => openFile(doc.id, f.path);
            sc.appendChild(fi);
          });
        }
      });
    }
    sidebar.appendChild(sc);
    main.appendChild(sidebar);
  }

  if (activePanel === 'git') {
    // Git panel
    const gp = document.createElement('div');
    gp.className = 'gp';
    gp.innerHTML =
      '<div style="font-weight:bold;margin-bottom:12px">🔀 版本管理 | Git</div>' +
      '<button class="btn-primary mb-2" onclick="pullGit()">↓ 拉取</button><br>' +
      '<button class="btn-secondary" onclick="commitGit()">✓ 提交</button>' +
      '<div style="margin:8px 0;font-size:12px;color:#858585">提交信息：</div>' +
      '<textarea id="commitMsg" placeholder="描述本次更改..." oninput="commitMsg=this.value"></textarea>' +
      '<div class="btns" style="margin-top:8px">' +
        '<button class="btn-primary" onclick="commitGit()">提交</button>' +
        '<button class="btn-secondary" onclick="pushGit()">↑ 推送</button>' +
      '</div>' +
      '<div class="sync-row" style="margin-top:8px">' +
        '<span style="font-size:12px">同步到</span>' +
        '<select id="remoteSelect" style="background:var(--bg);color:var(--text);border:1px solid var(--border);padding:4px 8px;flex:1">' +
          '<option value="">选择目标...</option>' +
          remotes.map(r => '<option value="' + r.name + '">' + r.name + '</option>').join('') +
          '<option value="__all">所有设备</option>' +
        '</select>' +
        '<button class="btn-secondary" onclick="syncToRemote(document.getElementById(\'remoteSelect\').value)">同步</button>' +
      '</div>' +
      '<div style="margin-top:16px;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#858585">最近提交</div>';
    if (commits.length === 0) {
      gp.innerHTML += '<div style="font-size:12px;color:#858585;padding:4px 0">暂无提交记录</div>';
    } else {
      commits.forEach(c => {
        const ci = document.createElement('div');
        ci.className = 'ci2';
        ci.innerHTML = '<span class="dot"></span><span class="msg">' + c.message + '</span><span class="tm">' + (c.date ? c.date.split('T')[0] : '') + '</span>';
        gp.appendChild(ci);
      });
    }
    main.appendChild(gp);
    loadGitData();
  }

  // Editor area
  const eara = document.createElement('div');
  eara.className = 'eara';

  if (editor.activeFilePath && activePanel !== 'git') {
    const etabs = document.createElement('div');
    etabs.className = 'etabs';
    etabs.innerHTML =
      '<div class="etab on"><span>' + editor.activeFilePath.split('/').pop() + '</span>' +
      (editor.unsaved ? '<span style="color:#e2c08d">●</span>' : '') + '</div>';
    eara.appendChild(etabs);
  }

  const ediv = document.createElement('div');
  ediv.className = 'ediv';

  if (activePanel !== 'git') {
    const ep = document.createElement('div');
    ep.style.cssText = 'flex:1;overflow:hidden;display:flex;flex-direction:column';

    const ta = document.createElement('textarea');
    ta.className = 'ed';
    ta.value = editor.content;
    ta.spellcheck = false;
    ta.oninput = e => onEditorChange(e.target.value);
    ep.appendChild(ta);
    ediv.appendChild(ep);

    const pp = document.createElement('div');
    pp.className = 'ppane';
    pp.innerHTML = parseMd(editor.content || '');
    ediv.appendChild(pp);
  }
  eara.appendChild(ediv);
  main.appendChild(eara);
  app.appendChild(menu);
  app.appendChild(main);

  // Status bar
  const sbar = document.createElement('div');
  sbar.className = 'sbar';
  sbar.innerHTML =
    '<span>🔀 ' + editor.gitBranch + '</span>' +
    (editor.fileSha ? '<span>' + editor.fileSha.slice(0,7) + '</span>' : '') +
    (editor.unsaved ? '<span style="color:#e2c08d">● 有未保存更改</span>' : '') +
    '<span class="r">VanillaEditor v0.1.0</span>' +
    '<span class="r">' + timeDisplay + '</span>';
  app.appendChild(sbar);
}

// ── Settings view ────────────────────────────────────────────
function renderSettings() {
  const app = document.getElementById('app');
  app.innerHTML =
    '<div class="pg">' +
      '<h4>设置</h4>' +
      '<div class="card">' +
        '<div class="card-title">编辑器</div>' +
        '<div style="margin-bottom:8px"><label>字体大小 ' +
          '<select style="background:var(--bg);color:var(--text);border:1px solid var(--border);width:80px;margin-left:8px"><option>12</option><option selected>14</option><option>16</option><option>18</option></select>' +
        '</label></div>' +
        '<div><label>主题 </label><span style="margin-left:8px">暗色（默认）</span></div>' +
      '</div>' +
      '<div class="card"><div class="card-title">关于</div>' +
        '<div style="font-size:12px;color:#858585">VanillaEditor v0.1.0<br>数据完全存储在本地，不上传任何第三方服务器</div>' +
      '</div>' +
    '</div>';
}

// ── Sync view ────────────────────────────────────────────────
function renderSync() {
  const app = document.getElementById('app');
  app.innerHTML =
    '<div class="pg">' +
      '<h4>同步设置</h4>' +
      '<div class="card">' +
        '<div class="card-title">远程设备</div>' +
        '<div style="font-size:13px;color:#858585;margin-bottom:12px">将其他设备的 VE 地址添加为 Git 远端，即可进行端到端同步。</div>' +
        '<div style="display:flex;gap:8px;margin-bottom:12px">' +
          '<input id="newRemoteUrl" placeholder="http://192.168.1.x:5000" style="flex:1">' +
          '<button class="btn-primary" onclick="addRemote()">+ 添加</button>' +
        '</div>' +
        '<div id="remoteList" style="font-size:12px;color:#858585">暂无远端设备</div>' +
      '</div>' +
    '</div>';
}

async function addRemote() {
  const url = document.getElementById('newRemoteUrl').value.trim();
  if (!url) return;
  const r = await apiFetch('/sync/remote', { method: 'POST', body: JSON.stringify({ doc_id: editor.activeDocId, name: 'remote', url: url }) });
  if (r) { document.getElementById('newRemoteUrl').value = ''; renderSync(); }
}

// ── Create doc ───────────────────────────────────────────────
async function createDoc() {
  const name = prompt('新建文档名称（如：notes.md）：');
  if (!name) return;
  const r = await apiFetch('/docs', { method: 'POST', body: JSON.stringify({ name: name, content: '' }) });
  if (r) { await loadFiles(); }
}

// ── Route handlers ───────────────────────────────────────────
Router.register('#/login', () => {
  if (auth.isLoggedIn) { Router.go('#/editor'); return; }
  renderLogin();
});
Router.register('#/editor', async () => {
  if (!auth.isLoggedIn) { Router.go('#/login'); return; }
  renderEditor();
  await loadFiles();
});
Router.register('#/settings', () => {
  if (!auth.isLoggedIn) { Router.go('#/login'); return; }
  renderSettings();
});
Router.register('#/sync', () => {
  if (!auth.isLoggedIn) { Router.go('#/login'); return; }
  renderSync();
});

// ── Init ─────────────────────────────────────────────────────
Router.render();
</script>
</body>
</html>
